plugins {
    id 'java'
    id 'jacoco'
    id 'jacoco-report-aggregation'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '2.0.0'
    id 'org.beryx.jlink' version '2.25.0'
}

group = 'com.vanxacloud.appstudio'
version = project['version']
if (repositories.isEmpty()) {
    repositories {
        mavenCentral()
    }
}

dependencies {
    jacocoAggregation project(':app')
    implementation(libs.apache.lang3)
    implementation(libs.apache.collections)
    implementation(libs.logback)
    implementation(libs.picocli)
    implementation(libs.bundles.jetty)
    implementation(libs.lanterna)
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
    useJUnitPlatform()
}

application {
    mainModule.set("app")
//    mainClass.set("com.vanxacloud.appstudio.mitmproxy.MitmProxy")
    mainClass.set("com.vanxacloud.appstudio.mitmproxy.ui.MitmProxyTerminal")
}

distributions {
    main {
        distributionBaseName = 'mitmproxy'
        distributionClassifier = 'bin'
    }
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport', JacocoReport)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}