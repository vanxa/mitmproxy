plugins {
    id 'java'
    id 'jacoco'
    id 'jacoco-report-aggregation'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '1.8.15'
    id 'org.beryx.jlink' version '2.25.0'
}

group = 'com.vanxacloud.appstudio'
version = project['version']
if (repositories.isEmpty()) {
    repositories {
        mavenCentral()
    }
}

dependencies {
    jacocoAggregation project(':app')
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation("ch.qos.logback:logback-classic:1.5.32")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
    useJUnitPlatform()
}

application {
    mainModule.set("com.vanxacloud.appstudio.mtlmproxy")
    mainClass.set("com.vanxacloud.appstudio.mtlmproxy.Main")
}

distributions {
    main {
        distributionBaseName = 'mtlmproxy'
        distributionClassifier = 'bin'
    }
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport', JacocoReport)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}